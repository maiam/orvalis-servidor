<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orvalis — teste do servidor</title>
<style>
  body { font: 16px system-ui, sans-serif; background: #1c1640; color: #f3eaff; margin: 0; padding: 16px; }
  main { max-width: 560px; margin: auto; }
  #estado { font-weight: 800; font-size: 20px; }
  .ok { color: #8ef0a7; } .erro { color: #ff8a9a; }
  pre { background: #2a2260; padding: 12px; border-radius: 10px; white-space: pre-wrap; min-height: 120px; }
  button { font: inherit; padding: 8px 14px; border-radius: 10px; border: 0; background: #ffd36b; color: #2a1a40; font-weight: 800; }
</style>
</head>
<body>
<main>
  <h1>Orvalis — teste do servidor</h1>
  <p>Esta página abre uma conexão em tempo real (WebSocket) com o servidor e manda uma mensagem a cada 2 segundos.</p>
  <p id="estado">Conectando…</p>
  <p>Conectados agora: <b id="conectados">–</b></p>
  <button id="enviar">Mandar "olá"</button>
  <pre id="log"></pre>
</main>
<script>
  const log = (t) => { const el = document.getElementById('log'); el.textContent = (new Date().toLocaleTimeString() + '  ' + t + '\n' + el.textContent).slice(0, 4000); };
  const estado = document.getElementById('estado');
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  const ws = new WebSocket(url);
  let n = 0;
  ws.onopen = () => {
    estado.textContent = '✅ Conectado — o servidor aceita WebSocket'; estado.className = 'ok'; log('conectado em ' + url);
    setInterval(() => ws.readyState === 1 && ws.send('ping ' + (++n)), 2000);
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.conectados !== undefined) document.getElementById('conectados').textContent = m.conectados;
    log(m.tipo === 'eco' ? 'eco: ' + m.texto : m.tipo + ' (' + m.conectados + ' conectados)');
  };
  ws.onclose = (e) => { estado.textContent = '❌ Conexão fechada (código ' + e.code + ')'; estado.className = 'erro'; log('fechou: ' + e.code); };
  ws.onerror = () => { estado.textContent = '❌ Não conectou — a hospedagem pode não aceitar WebSocket'; estado.className = 'erro'; };
  document.getElementById('enviar').onclick = () => ws.send('olá');
</script>
</body>
</html>
