<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orvalis — teste do servidor</title>
<style>
  body { font: 16px system-ui, sans-serif; background: #1c1640; color: #f3eaff; margin: 0; padding: 16px; }
  main { max-width: 560px; margin: auto; }
  #estado { font-weight: 800; font-size: 20px; }
  .ok { color: #8ef0a7; } .erro { color: #ff8a9a; }
  label { display: block; margin: 8px 0 4px; }
  input { font: inherit; padding: 8px; border-radius: 8px; border: 0; width: 100%; box-sizing: border-box; }
  button { font: inherit; padding: 8px 14px; border-radius: 10px; border: 0; background: #ffd36b; color: #2a1a40; font-weight: 800; margin: 10px 6px 0 0; }
  pre { background: #2a2260; padding: 12px; border-radius: 10px; white-space: pre-wrap; min-height: 120px; }
  #codigo { font-size: 28px; letter-spacing: 4px; color: #ffd36b; }
</style>
</head>
<body>
<main>
  <h1>Orvalis — teste do servidor</h1>
  <p id="estado">Conectando…</p>
  <label>Seu nome <input id="nome" value="Teste" maxlength="16"></label>
  <label>Número da sala <input id="sala" value="1" maxlength="3" inputmode="numeric"></label>
  <button id="entrar">Entrar na sala</button>
  <p>Sala: <b id="codigo">–</b> · Na sala: <b id="gente">–</b></p>
  <pre id="log"></pre>
</main>
<script>
  // Mesmo protocolo do jogo (src/net/protocol.ts, PROTOCOL_VERSION abaixo deve bater com /saude).
  const log = (t) => { const el = document.getElementById('log'); el.textContent = (new Date().toLocaleTimeString() + '  ' + t + '\n' + el.textContent).slice(0, 4000); };
  const estado = document.getElementById('estado');
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  let versao = 1;
  fetch('/saude').then((r) => r.json()).then((s) => { versao = s.protocolo; log('servidor: ' + s.pacote); });
  const nomes = new Map();
  const mostrarGente = () => { document.getElementById('gente').textContent = [...nomes.values()].join(', ') || '–'; };
  let ws;
  function conectar() {
    ws = new WebSocket(url);
    ws.onopen = () => { estado.textContent = '✅ Conectado'; estado.className = 'ok'; };
    ws.onclose = (e) => { estado.textContent = '❌ Conexão fechada (' + e.code + ')'; estado.className = 'erro'; };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.t === 'welcome') {
        document.getElementById('codigo').textContent = m.roomName;
        nomes.clear(); nomes.set(m.you, document.getElementById('nome').value + ' (você)');
        for (const p of m.players) nomes.set(p.id, p.name);
        mostrarGente();
        log('entrou na ' + m.roomName + ' (seed ' + m.seed + ', ' + m.chunks.length + ' chunks editados)');
      } else if (m.t === 'joined') { nomes.set(m.player.id, m.player.name); mostrarGente(); log(m.player.name + ' entrou'); }
      else if (m.t === 'left') { log((nomes.get(m.id) || m.id) + ' saiu'); nomes.delete(m.id); mostrarGente(); }
      else if (m.t === 'error') log('erro: ' + m.message);
      else if (m.t !== 'state') log(JSON.stringify(m));
    };
  }
  conectar();
  document.getElementById('entrar').onclick = () => {
    const hello = { t: 'hello', v: versao, name: document.getElementById('nome').value, room: Number(document.getElementById('sala').value) || 1 };
    if (ws.readyState !== 1) { conectar(); ws.addEventListener('open', () => ws.send(JSON.stringify(hello)), { once: true }); return; }
    ws.send(JSON.stringify(hello));
  };
</script>
</body>
</html>
